<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>百度网盘转存</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <form id="transferForm" class="transfer-form" novalidate>
          <section class="form-card">
            <div class="field-group">
              <label class="sr-only" for="shareInput">分享链接</label>
              <textarea
                id="shareInput"
                rows="4"
                spellcheck="false"
                autocomplete="off"
                placeholder="粘贴百度网盘分享链接，也可以包含提取码"
                required
              ></textarea>
              <div id="linkSummary" class="link-summary" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 12 2.2 2.2 4.8-5" /></svg>
                <span id="linkSummaryText"></span>
              </div>
              <p id="inputError" class="field-error" role="alert" hidden></p>
            </div>

            <div class="two-fields">
              <div class="field-group compact">
                <label class="sr-only" for="passwordInput">提取码</label>
                <input
                  id="passwordInput"
                  type="text"
                  inputmode="text"
                  maxlength="4"
                  autocomplete="off"
                  placeholder="提取码"
                  aria-label="提取码"
                />
              </div>
              <div class="field-group compact target-field">
                <label class="sr-only" for="targetInput">保存目录</label>
                <input
                  id="targetInput"
                  type="text"
                  value="/我的资源"
                  placeholder="保存目录"
                  aria-label="保存目录"
                  autocomplete="off"
                />
              </div>
            </div>

            <button id="startButton" class="primary-button" type="submit">
              <span class="button-label">开始转存</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" /></svg>
            </button>
          </section>
        </form>

        <section id="progressCard" class="console-panel" aria-live="polite">
          <header class="console-toolbar">
            <div class="console-heading">
              <span class="console-indicator" aria-hidden="true"></span>
              <strong>输出</strong>
            </div>
            <div class="output-actions">
              <button id="stopButton" class="output-button danger" type="button" hidden>停止</button>
              <button id="clearLogButton" class="output-button" type="button">清空</button>
            </div>
          </header>

          <div class="console-body">
            <div id="outputEmpty" class="output-empty">
              <span class="console-prompt" aria-hidden="true">›</span>
              <span>等待转存任务</span>
            </div>
            <div id="progressContent" hidden>
              <div class="progress-heading">
                <strong id="stageText">正在准备…</strong>
                <span id="progressPercent">0%</span>
              </div>
              <div class="progress-track" aria-hidden="true">
                <span id="progressBar"></span>
              </div>

              <div class="stat-grid">
                <div class="stat-item"><strong id="statDiscovered">0</strong><span>已发现</span></div>
                <div class="stat-item"><strong id="statBatches">0</strong><span>已处理</span></div>
                <div class="stat-item"><strong id="statSkipped">0</strong><span>已跳过</span></div>
              </div>

              <ol id="logList" class="log-list" aria-label="处理记录"></ol>
            </div>

            <section id="resultCard" class="result-card" aria-live="assertive" hidden>
              <div class="result-symbol" aria-hidden="true"></div>
              <div class="result-copy">
                <strong id="resultTitle"></strong>
                <span id="resultDetail"></span>
              </div>
              <button id="openPanButton" class="mini-button" type="button" hidden>打开网盘</button>
            </section>
          </div>
        </section>
      </section>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
